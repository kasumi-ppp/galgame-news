[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galgame-news"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "Pillow>=10.0",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "ddgs>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
